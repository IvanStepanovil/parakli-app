<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Паракли</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="api.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* ===== ПУТИ К КАРТИНКАМ — поменяйте на свои ===== */
    --img-bg:        url('Фото/Фон\ главного\ экрана.png');        /* общий фон экрана      */
    --img-quote:     url('Фото/Фото\ цитаты\ дня.png');       /* фон «Цитата дня»      */
    --img-recovery:  url('Фото/Фон\ кнопки\ восстановление.png');  /* карточка Восстановление */
    --img-relax:     url('Фото/Фото\ для\ кнопки\ расслабление.png');     /* карточка Расслабление */
    --img-sleep:     url('Фото/Фон\ для\ кнопки\ сон.png');     /* карточка Сон          */
    --img-move:      url('Фото/Фото\ для\ кнопки\ Движение.png');      /* карточка Движение     */
    /* Логотип сверху и значок «О нас» задаются в HTML ниже (тег <img>) */

    --ink: #1c1510;
    --muted: #8a7a68;
    --gold: #b98a52;
    --gold-dark: #8c6330;
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
    --nav-h: 66px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: calc(env(safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: var(--sans); color: var(--ink);
    background-color: #f1e4cf;
    background-image: var(--img-bg);
    background-size: cover; background-position: center top;
    background-repeat: no-repeat; background-attachment: fixed;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
  button:focus-visible { outline: 3px solid rgba(185,138,82,.55); outline-offset: 2px; }

  .screen {
    max-width: 480px; margin: 0 auto;
    padding: calc(var(--safe-t) + 14px) 14px calc(var(--nav-h) + var(--safe-b) + 18px);
  }

  /* Логотип */
  .logo { display: flex; justify-content: center; margin: 4px 0 14px; }
  .logo img { display: block; width: 100%; max-width: 190px; height: auto; }

  /* Цитата дня */
  .quote {
    position: relative; border-radius: 22px; overflow: hidden;
    min-height: 148px; padding: 18px 20px 20px;
    background: var(--img-quote) center / cover no-repeat, rgba(255,250,240,.45);
    box-shadow: 0 6px 18px rgba(120,88,40,.10), inset 0 0 0 1px rgba(255,255,255,.55);
  }
  .quote .label { margin: 0 0 8px; font-size: 14px; font-weight: 400; color: var(--gold); }
  .quote .text {
    margin: 0; max-width: 72%;
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(21px, 6vw, 26px); line-height: 1.18; color: var(--ink);
    overflow-wrap: anywhere; hyphens: auto;
  }

  h2.title {
    margin: 22px 0 14px;
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(27px, 8vw, 34px); line-height: 1.1; letter-spacing: -.005em;
  }

  /* Карточки разделов */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    position: relative; overflow: hidden; isolation: isolate;
    aspect-ratio: 1 / .74; border-radius: 22px;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 12px 14px 14px;
    box-shadow: 0 6px 16px rgba(120,88,40,.12), inset 0 0 0 1px rgba(255,255,255,.55);
    background-color: rgba(255,250,240,.4);
    transition: transform .12s;
  }
  .card:active { transform: scale(.985); }
  .card .photo {
    position: absolute; inset: 0; z-index: -2;
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  .card .name { font-family: var(--serif); font-weight: 600; font-size: clamp(18px, 5.2vw, 22px); line-height: 1.05; }
  .card .desc { margin-top: 4px; font-size: 12px; line-height: 1.25; color: var(--muted); }
  .badge {
    position: absolute; top: 12px; left: 12px;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
  }
  .badge svg { width: 20px; height: 20px; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }

  .card.active .badge { background: linear-gradient(160deg, #c39a62, #9a6c34); box-shadow: 0 3px 8px rgba(140,99,48,.35); }
  .card.active .badge svg { stroke: #fff; }

  /* Заблокированные: фото остаётся, но приглушено и серое */
  .card.locked .photo { filter: grayscale(.95) contrast(.82) brightness(1.1) blur(1px); transform: scale(1.04); }
  .card.locked::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: rgba(232,229,224,.55);
  }
  .card.locked .badge { background: rgba(140,135,128,.45); }
  .card.locked .badge svg { stroke: #fff; }
  .card.locked .name { color: #4a443d; }
  .card.locked .desc { color: #9a928a; }

  #p-recovery { background-image: var(--img-recovery); }
  #p-relax    { background-image: var(--img-relax); }
  #p-sleep    { background-image: var(--img-sleep); }
  #p-move     { background-image: var(--img-move); }

  /* Нижние кнопки */
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .link {
    display: flex; align-items: center; gap: 10px;
    height: 52px; padding: 0 14px; border-radius: 20px;
    font-size: 15px; font-weight: 400;
    background: rgba(255,251,244,.78);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 4px 12px rgba(120,88,40,.10), inset 0 0 0 1px rgba(255,255,255,.7);
  }
  .link .ico { width: 26px; height: 26px; flex: none; display: grid; place-items: center; }
  .link .ico svg { width: 24px; height: 24px; fill: none; stroke: var(--gold-dark); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .link .ico img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .link .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link .chev { width: 16px; height: 16px; flex: none; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Нижняя навигация */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    max-width: 480px; margin: 0 auto;
    height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
    display: grid; grid-template-columns: 1fr 1fr;
    border-radius: 24px 24px 0 0;
    background: rgba(255,251,244,.88);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 -4px 18px rgba(120,88,40,.10);
  }
  .tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: var(--muted); text-align: center; }
  .tab svg { width: 26px; height: 26px; }
  .tab.on { color: var(--gold-dark); font-weight: 500; }
  .tab.on::after { content: ""; position: absolute; bottom: 6px; width: 34px; height: 3px; border-radius: 3px; background: var(--gold); }
  .tab .fill { fill: var(--gold); stroke: none; }
  .tab .line { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* Окно-уведомление */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(40,28,14,.38);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .overlay.open { display: flex; }
  .dialog {
    position: relative; width: 100%; max-width: 320px; text-align: center;
    padding: 30px 24px 22px; border-radius: 24px;
    background: #fbf5ea; box-shadow: 0 18px 40px rgba(60,40,15,.28);
  }
  .dialog p { margin: 0 0 20px; font-family: var(--serif); font-weight: 500; font-size: 22px; line-height: 1.2; }
  .dialog .ok {
    width: 100%; height: 48px; border-radius: 16px; text-align: center;
    color: #fff; font-size: 17px;
    background: linear-gradient(180deg, #b98a52, #96683a);
    box-shadow: 0 6px 14px rgba(140,99,48,.3);
  }
  .dialog .x { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }
  .dialog .x svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main class="screen">
  <!-- Цитата дня -->
  <section class="quote" id="quote" hidden>
    <p class="label">Цитата дня</p>
    <p class="text" id="quoteText"></p>
  </section>

  <h2 class="title">Над чем работаем сегодня?</h2>

  <!-- Разделы -->
  <div class="grid">
    <button class="card active" id="card-recovery" type="button" data-route="recovery">
      <div class="photo" id="p-recovery"></div>
      <span class="badge"><svg viewBox="0 0 24 24"><path d="M12 19c-3-1.5-5-4-5-7 2 0 4 1 5 3 1-2 3-3 5-3 0 3-2 5.5-5 7z"/><path d="M12 15c-1.5-2-1.5-5 0-8 1.5 3 1.5 6 0 8z"/></svg></span>
      <span class="name">Восстановление</span>
      <span class="desc">Больше энергии<br>для важного</span>
    </button>

    <button class="card locked" id="card-relax" type="button" data-locked="1">
      <div class="photo" id="p-relax"></div>
      <span class="badge"><svg viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M8.5 11V8.5a3.5 3.5 0 017 0V11"/></svg></span>
      <span class="name">Расслабление</span>
      <span class="desc">Ожидается</span>
    </button>

    <button class="card locked" id="card-sleep" type="button" data-locked="1">
      <div class="photo" id="p-sleep"></div>
      <span class="badge"><svg viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M8.5 11V8.5a3.5 3.5 0 017 0V11"/></svg></span>
      <span class="name">Сон</span>
      <span class="desc">Ожидается</span>
    </button>

    <button class="card locked" id="card-move" type="button" data-locked="1">
      <div class="photo" id="p-move"></div>
      <span class="badge"><svg viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M8.5 11V8.5a3.5 3.5 0 017 0V11"/></svg></span>
      <span class="name">Движение</span>
      <span class="desc">Ожидается</span>
    </button>
  </div>

  <!-- Нижние кнопки -->
  <div class="links">
    <button class="link" type="button" data-route="catalog">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V7a3 3 0 016 0v1"/></svg></span>
      <span class="lbl">Каталог товаров</span>
      <svg class="chev" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg>
    </button>
    <button class="link" type="button" data-route="about">
      <!-- Значок «О нас»: только изображение логотипа (без текста). Поменяйте путь на свой -->
      <span class="ico"><img src="Фото/Лого.png" alt=""></span>
      <span class="lbl">О нас</span>
      <svg class="chev" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg>
    </button>
  </div>
</main>

<!-- Нижняя навигация -->
<nav class="nav" aria-label="Навигация">
  <button class="tab on" type="button" aria-current="page">
    <svg viewBox="0 0 24 24"><path class="fill" d="M3 11.2L11.2 3.9a1.2 1.2 0 011.6 0L21 11.2V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>
    <span>Главная</span>
  </button>
  <button class="tab" type="button" data-route="profile">
    <svg viewBox="0 0 24 24"><circle class="line" cx="12" cy="8" r="4"/><path class="line" d="M4.5 21c0-4.2 3.4-6.5 7.5-6.5s7.5 2.3 7.5 6.5"/></svg>
    <span>Профиль</span>
  </button>
</nav>

<!-- Окно-уведомление -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogText">
  <div class="dialog">
    <button class="x" id="dialogX" type="button" aria-label="Закрыть"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
    <p id="dialogText"></p>
    <button class="ok" id="dialogOk" type="button">Понятно</button>
  </div>
</div>

<script>
(function () {
  /* ================= НАСТРОЙКИ ================= */
  // Страницы, куда ведут кнопки. Пока страницы не созданы — оставьте пустую строку ''
  var ROUTES = {
    recovery: '',   // например 'recovery.html'
    catalog:  'catalog.html',   // например 'catalog.html'
    about:    '',   // например 'about.html'
    profile:  'profile.html'    // например 'profile.html'
  };
  var QUOTES_URL = 'quotes.json';     // файл с цитатами
  var QUOTES_START_DATE = '2026-10-13'; // в этот день (по Москве) показывается цитата №1
  var TZ = 'Europe/Moscow';
  var MSK_OFFSET_MS = 3 * 3600 * 1000;  // Москва: UTC+3, без перехода на летнее время
  /* ============================================== */

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#f1e4cf'); tg.setBackgroundColor('#f1e4cf'); } catch (e) {} }

  // Защита от прямого открытия: без регистрации — на экран регистрации
  var ok = false;
  try { ok = sessionStorage.getItem('parakli_verified') === '1'; } catch (e) {}
  if (!ok) { location.replace('index.html' + location.search); return; }

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- Окно-уведомление ---------- */
  var overlay = $('overlay');
  function openDialog(text) { $('dialogText').textContent = text; overlay.classList.add('open'); $('dialogOk').focus(); }
  function closeDialog() { overlay.classList.remove('open'); }
  $('dialogOk').addEventListener('click', closeDialog);
  $('dialogX').addEventListener('click', closeDialog);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeDialog(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDialog(); });

  /* ---------- Карточки и кнопки ---------- */
  ['card-relax', 'card-sleep', 'card-move'].forEach(function (id) {
    $(id).addEventListener('click', function () { openDialog('Извините, этот раздел пока в разработке'); });
  });

  document.querySelectorAll('[data-route]').forEach(function (el) {
    el.addEventListener('click', function () {
      var url = ROUTES[el.getAttribute('data-route')];
      if (url) { location.href = url + location.search; }
      else { openDialog('Этот раздел скоро появится'); }
    });
  });

  /* ---------- Цитата дня (по московской дате) ---------- */
  var clockOffset = 0;   // разница «серверное время − часы устройства»
  var quotes = [];

  function nowMs() { return Date.now() + clockOffset; }

  function mskDayNumber(ms) {
    // Номер календарного дня по Москве (целое число суток от 1970-01-01)
    var parts = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' })
      .format(new Date(ms)).split('-');
    return Math.floor(Date.UTC(+parts[0], +parts[1] - 1, +parts[2]) / 86400000);
  }

  function startDayNumber() {
    var p = QUOTES_START_DATE.split('-');
    return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
  }

  function renderQuote() {
    var box = $('quote');
    if (!quotes.length) { box.hidden = true; return; }
    var n = quotes.length;
    var idx = (((mskDayNumber(nowMs()) - startDayNumber()) % n) + n) % n;
    $('quoteText').textContent = quotes[idx].text;
    box.hidden = false;
  }

  function scheduleMidnight() {
    var ms = 86400000 - ((nowMs() + MSK_OFFSET_MS) % 86400000);   // до ближайших 00:00 МСК
    setTimeout(function () { renderQuote(); scheduleMidnight(); }, ms + 500);
  }

  function loadQuotes() {
    // Время берём из заголовка Date ответа сервера, чтобы не зависеть от неточных часов телефона
    fetch(QUOTES_URL, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        var d = Date.parse(r.headers.get('Date') || '');
        if (!isNaN(d)) clockOffset = d - Date.now();
        return r.json();
      })
      .then(function (data) {
        if (!Array.isArray(data)) throw new Error('format');
        quotes = data.filter(function (q) { return q && typeof q.text === 'string' && q.text.trim(); });
      })
      .catch(function (e) { console.warn('Цитаты не загружены:', e); quotes = []; })
      .then(function () { renderQuote(); scheduleMidnight(); });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) renderQuote(); });
  loadQuotes();
})();
</script>
</body>
</html>
