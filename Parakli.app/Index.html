<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Паракли — личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="api.js"></script>
<script src="documents.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* ПУТИ К КАРТИНКАМ — поменяйте на свои */
    --bg-image: url('Фото/Фон\ регистрации.png');
    --bg-1: #f6ecdc;
    --bg-2: #efe0c8;
    --ink: #1c1510;
    --muted: #7a6a58;
    --gold: #b98a52;
    --gold-dark: #8c6330;
    --field: rgba(255, 252, 245, .72);
    --field-border: #dcc9a8;
    --error: #b0402f;
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background-color: var(--bg-1);
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    overflow-x: hidden;
    position: relative;
  }
 
 
  .wrap { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: 22px 16px 28px; }
 
  /* Логотип (картинка) */
  .logo { display: flex; justify-content: center; margin-bottom: 18px; }
  .logo img { display: block; width: 100%; max-width: 220px; height: auto; }
 
  h1 {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(38px, 11.5vw, 52px); line-height: 1.04;
    margin: 18px 0 8px; letter-spacing: -.01em;
  }
  .sub { margin: 0 0 22px; font-size: 18px; font-weight: 300; color: var(--muted); }
 
  /* Поля */
  .field {
    display: flex; align-items: center; gap: 14px;
    height: 54px; padding: 0 18px;
    background: var(--field);
    border: 1px solid var(--field-border);
    border-radius: 16px;
    margin-bottom: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 2px 6px rgba(140,99,48,.06);
    transition: border-color .15s, box-shadow .15s;
  }
  .field:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(185,138,82,.22); }
  .field.invalid { border-color: var(--error); }
  .field svg.ic { width: 24px; height: 24px; flex: none; stroke: var(--gold-dark); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .field input {
    flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
    font: 400 18px var(--sans); color: var(--ink);
  }
  .field input::placeholder { color: #8d7d6a; font-weight: 300; }
 
  /* Телефон с флагом */
  .cc { position: relative; display: flex; align-items: center; gap: 10px; flex: none; }
  .cc select {
    position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; font-size: 16px;
  }
  .flag { width: 34px; height: 24px; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.08); font-size: 0; }
  .flag i { display: block; height: 33.34%; }
  .chev { width: 14px; height: 14px; stroke: var(--gold-dark); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .prefix { font-size: 18px; color: var(--ink); white-space: nowrap; }
 
  /* Чекбоксы */
  .check { display: flex; align-items: center; gap: 14px; margin: 18px 0 0; cursor: pointer; font-size: 16px; line-height: 1.3; }
  .check input { position: absolute; opacity: 0; }
  .box {
    flex: none; width: 30px; height: 30px; border-radius: 8px;
    background: rgba(255,252,245,.75); border: 1.5px solid var(--gold);
    display: grid; place-items: center; transition: background .15s;
  }
  .box svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(.6); transition: .15s; }
  .check input:checked + .box { background: linear-gradient(160deg, #a77a45, #7f5726); border-color: #7f5726; }
  .check input:checked + .box svg { opacity: 1; transform: none; }
  .check input:focus-visible + .box { box-shadow: 0 0 0 3px rgba(185,138,82,.35); }
  .check a { color: inherit; text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 3px; }
  label.box { cursor: pointer; position: relative; }
  label.box::after { content: ""; position: absolute; inset: -8px; }   /* увеличенная область нажатия */
  .check:has(button) { cursor: default; }
  .check-text { flex: 1; min-width: 0; }
  .check-text .doc-link { display: inline; }
  .doc-link {
    font: inherit; line-height: inherit; color: inherit; text-align: left; background: none; border: 0; padding: 0; cursor: pointer;
    text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 4px;
  }
  .doc-link:focus-visible { outline: 3px solid rgba(185,138,82,.45); outline-offset: 3px; border-radius: 4px; }

  /* Окно с документом */
  html.noscroll, html.noscroll body { overflow: hidden; }
  .doc-back {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(40,28,12,0); transition: background .22s;
  }
  .doc-back[hidden] { display: none; }
  .doc-back.open { background: rgba(40,28,12,.42); }
  .doc-sheet {
    width: 100%; max-width: 480px; max-height: 88vh; max-height: 88dvh; display: flex; flex-direction: column;
    background: #fbf5ea; border-radius: 26px 26px 0 0; box-shadow: 0 -10px 30px rgba(60,40,10,.25);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transform: translateY(28px); opacity: 0; transition: transform .25s ease, opacity .22s;
  }
  .doc-back.open .doc-sheet { transform: none; opacity: 1; }
  .doc-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 16px 10px 20px; }
  .doc-head h2 { flex: 1; margin: 0; font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 1.12; }
  .doc-x {
    flex: none; width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 50%;
    background: rgba(232,214,184,.65); cursor: pointer;
  }
  .doc-x svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; }
  .doc-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 20px 12px; }
  .doc-head .kicker { display: block; margin-bottom: 6px; font-family: var(--sans); font-weight: 500; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-dark, #8c6330); }
  .doc-edition { display: inline-block; margin: 0 20px 6px; padding: 4px 11px; border-radius: 10px; font-size: 12.5px; color: #8c6330; background: rgba(232,214,184,.7); }
  .doc-body { counter-reset: none; }
  .doc-body h3 { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 8px; padding-top: 16px; border-top: 1px solid rgba(185,138,82,.25); font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.2; }
  .doc-body h3 .n { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-family: var(--sans); font-weight: 500; font-size: 13px; color: #fff; background: linear-gradient(160deg, #b98a52, #8c6330); transform: translateY(-2px); }
  .doc-body p { margin: 0 0 10px; font-size: 15px; line-height: 1.6; color: #3d3226; }
  .doc-body p.lead { padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.65); box-shadow: inset 0 0 0 1px rgba(185,138,82,.22); font-size: 14.5px; }
  .doc-body ul { list-style: none; margin: 4px 0 12px; padding: 0; }
  .doc-body li { position: relative; margin: 0 0 8px; padding-left: 20px; font-size: 15px; line-height: 1.55; color: #3d3226; }
  .doc-body li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: #b98a52; }
  .doc-body a, .doc-body .xref { color: #8c6330; text-decoration: underline; text-decoration-color: rgba(185,138,82,.6); text-underline-offset: 3px; word-break: break-word; }
  .doc-body .final { margin-top: 22px; padding: 16px; border-radius: 18px; background: rgba(232,214,184,.45); }
  .doc-body .final h3 { margin-top: 0; padding-top: 0; border-top: 0; }
  .doc-body .final p:last-child { margin-bottom: 0; }
  .doc-foot { padding: 10px 16px 16px; }
  .doc-ok {
    display: block; width: 100%; height: 52px; border: 0; border-radius: 16px; cursor: pointer;
    font: 400 18px var(--sans); color: #fff;
    background: linear-gradient(135deg, #c9a06a 0%, #a8773f 55%, #94672f 100%);
    box-shadow: 0 8px 20px rgba(120,80,30,.25), inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .doc-x:focus-visible, .doc-ok:focus-visible { outline: 3px solid rgba(185,138,82,.5); outline-offset: 2px; }
 
  /* Кнопка */
  .btn {
    display: block; width: 100%; height: 62px; margin-top: 26px;
    border: 0; border-radius: 18px; cursor: pointer;
    font: 400 24px var(--sans); letter-spacing: .02em; color: #fff;
    background: linear-gradient(180deg, #b98a52, #96683a);
    box-shadow: 0 8px 18px rgba(140,99,48,.32), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .1s, opacity .2s, filter .2s;
  }
  .btn:active { transform: scale(.985); }
  .btn:disabled { opacity: .55; filter: saturate(.7); cursor: not-allowed; }
  .btn:focus-visible { outline: 3px solid rgba(185,138,82,.5); outline-offset: 3px; }
 
  .hint { margin: -6px 6px 14px; font-size: 13px; color: var(--muted); }
 
  .msg { min-height: 20px; margin: 12px 4px 0; font-size: 14px; color: var(--error); }
  body.loading .wrap { visibility: hidden; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="loading">
 
<main class="wrap">
 
  <h1>Создаём ваш личный кабинет</h1>
  <p class="sub">Это займёт меньше минуты</p>
 
  <div class="field" data-for="first_name">
    <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    <input id="first_name" type="text" placeholder="Имя" autocomplete="off" maxlength="40" required>
  </div>
 
  <div class="field" data-for="last_name">
    <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    <input id="last_name" type="text" placeholder="Фамилия" autocomplete="off" maxlength="40" required>
  </div>
 
  <div class="field" data-for="phone">
    <label class="cc" aria-label="Код страны">
      <span class="flag" id="flag"><i style="background:#fff"></i><i style="background:#1c57a5"></i><i style="background:#d52b1e"></i></span>
      <svg class="chev" viewBox="0 0 16 16"><path d="M3 6l5 5 5-5"/></svg>
      <select id="country">
        <option value="+7" data-flag="ru" selected>Россия +7</option>
        <option value="+7" data-flag="kz">Казахстан +7</option>
        <option value="+375" data-flag="by">Беларусь +375</option>
        <option value="+380" data-flag="ua">Украина +380</option>
        <option value="+374" data-flag="am">Армения +374</option>
        <option value="+995" data-flag="ge">Грузия +995</option>
        <option value="+998" data-flag="uz">Узбекистан +998</option>
        <option value="+49" data-flag="de">Германия +49</option>
      </select>
    </label>
    <span class="prefix" id="prefix">+7</span>
    <input id="phone" type="tel" inputmode="tel" placeholder="900 123-45-67" autocomplete="off" required>
  </div>
  
  <div class="field" data-for="email">
    <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
    <input id="email" type="email" inputmode="email" placeholder="E-mail" autocomplete="off" maxlength="80" required>
  </div>
 
  <div class="field" data-for="city">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
    <input id="city" type="text" placeholder="Город" autocomplete="off" maxlength="60" required>
  </div>
 
  <!-- Нажатие на квадрат отмечает галочку, нажатие на подчёркнутый текст открывает документ -->
  <!-- 1. Обязательное: документы 01 и 03 -->
  <div class="check">
    <input type="checkbox" id="consent">
    <label class="box" for="consent" aria-label="Я согласен(а) с обработкой персональных данных и политикой обработки персональных данных"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></label>
    <span class="check-text">Я согласен(а) с <button type="button" class="doc-link" data-doc="consent">обработкой персональных данных</button>, <button type="button" class="doc-link" data-doc="policy">политикой обработки персональных данных</button></span>
  </div>

  <!-- 2. Обязательное: документ 04 -->
  <div class="check">
    <input type="checkbox" id="offer">
    <label class="box" for="offer" aria-label="Я принимаю условия пользовательского соглашения"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></label>
    <span class="check-text">Я принимаю условия <button type="button" class="doc-link" data-doc="terms">пользовательского соглашения</button></span>
  </div>

  <!-- 3. Обязательное: подтверждение возраста -->
  <label class="check">
    <input type="checkbox" id="age">
    <span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <span>Подтверждаю, что мне<br>исполнилось 14 лет</span>
  </label>

  <!-- 4. Необязательное, по умолчанию не отмечено: документ 02 -->
  <div class="check">
    <input type="checkbox" id="ads">
    <label class="box" for="ads" aria-label="Соглашаюсь на получение рекламной рассылки"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></label>
    <span class="check-text">Соглашаюсь на получение <button type="button" class="doc-link" data-doc="ads">рекламной рассылки</button></span>
  </div>

  <button class="btn" id="submit" type="button" disabled>Продолжить</button>
  <div class="msg" id="msg" role="alert"></div>
</main>

<!-- Окно с документом -->
<div class="doc-back" id="docModal" hidden>
  <div class="doc-sheet" role="dialog" aria-modal="true" aria-labelledby="docTitle">
    <div class="doc-head">
      <h2 id="docTitle"><span class="kicker" id="docKicker"></span><span id="docTitleText"></span></h2>
      <button type="button" class="doc-x" id="docX" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div><span class="doc-edition" id="docEdition"></span></div>
    <div class="doc-body" id="docBody"></div>
    <div class="doc-foot"><button type="button" class="doc-ok" id="docOk">Закрыть</button></div>
  </div>
</div>
 
<script>
(function () {
  var MAIN_PAGE = 'main.html';

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#f6ecdc'); tg.setBackgroundColor('#f6ecdc'); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var fields = ['first_name', 'last_name', 'phone', 'email', 'city'];
  var btn = $('submit'), msg = $('msg');

  function goMain() { location.replace(MAIN_PAGE + location.search); }

  /* ---------- Уже зарегистрирован? Тогда сразу на главный экран ---------- */
  var shown = false;
  function showForm() { if (shown) return; shown = true; document.body.classList.remove('loading'); }
  setTimeout(showForm, 6000);

  Parakli.getSession().then(function (r) {
    if (r.ok && r.data.registered) { Parakli.markVerified(); goMain(); return; }
    showForm();
    if (r.status === 401) msg.textContent = 'Откройте приложение из Telegram: отправьте боту команду /start.';
  }).catch(function () {
    showForm();
    msg.textContent = 'Нет связи с сервером. Попробуйте позже.';
  });

  /* ---------- Флаги стран ---------- */
  var FLAGS = {
    ru: ['#fff', '#1c57a5', '#d52b1e'], kz: ['#00afca', '#00afca', '#00afca'],
    by: ['#d22730', '#d22730', '#00a651'], ua: ['#0057b7', '#0057b7', '#ffd700'],
    am: ['#d90012', '#0033a0', '#f2a800'], ge: ['#fff', '#d52b1e', '#fff'],
    uz: ['#1eb53a', '#fff', '#0099b5'], de: ['#000', '#dd0000', '#ffce00']
  };
  $('country').addEventListener('change', function () {
    var o = this.options[this.selectedIndex];
    $('prefix').textContent = o.value;
    var c = FLAGS[o.dataset.flag] || FLAGS.ru;
    $('flag').innerHTML = c.map(function (x) { return '<i style="background:' + x + '"></i>'; }).join('');
    validate();
  });

  /* ---------- Маска телефона: 900 123-45-67 ---------- */
  $('phone').addEventListener('input', function () {
    var d = this.value.replace(/\D/g, '');
    if ($('prefix').textContent === '+7') {
      if (d.length >= 11 && (d[0] === '8' || d[0] === '7')) d = d.slice(1);
      d = d.slice(0, 10);
      var s = d.slice(0, 3);
      if (d.length > 3) s += ' ' + d.slice(3, 6);
      if (d.length > 6) s += '-' + d.slice(6, 8);
      if (d.length > 8) s += '-' + d.slice(8, 10);
      this.value = s;
    } else {
      this.value = d.slice(0, 12);
    }
  });

  /* ---------- Проверка полей ---------- */
  var rules = {
    first_name: function (v) { return v.trim().length >= 2; },
    last_name: function (v) { return v.trim().length >= 2; },
    phone: function (v) {
      var n = v.replace(/\D/g, '');
      return $('prefix').textContent === '+7' ? n.length === 10 : n.length >= 7;
    },
    email: function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()); },
    city: function (v) { return v.trim().length >= 2; }
  };

  function validate(showErrors) {
    var ok = true;
    fields.forEach(function (id) {
      var valid = rules[id]($(id).value);
      if (!valid) ok = false;
      var wrap = document.querySelector('.field[data-for="' + id + '"]');
      if (showErrors) wrap.classList.toggle('invalid', !valid);
      else if (valid) wrap.classList.remove('invalid');
    });
    var checks = $('consent').checked && $('offer').checked && $('age').checked;   // рекламная рассылка необязательна
    btn.disabled = !(ok && checks);
    return ok && checks;
  }

  fields.concat(['consent', 'offer', 'age', 'ads']).forEach(function (id) {
    $(id).addEventListener('input', function () { validate(false); });
    $(id).addEventListener('change', function () { validate(false); });
  });

  /* ---------- Отправка ---------- */
  var sending = false;
  btn.addEventListener('click', function () {
    msg.style.color = '';
    if (!validate(true)) { msg.textContent = 'Проверьте выделенные поля.'; return; }
    if (sending) return;
    sending = true; btn.disabled = true; msg.textContent = '';

    Parakli.register({
      first_name: $('first_name').value.trim(),
      last_name: $('last_name').value.trim(),
      phone: $('prefix').textContent + $('phone').value.replace(/\D/g, ''),
      email: $('email').value.trim(),
      city: $('city').value.trim(),
      age_confirmed: $('age').checked,   // подтверждение, что пользователю есть 14 лет
      ads_consent: $('ads').checked      // согласие на рекламную рассылку
    }).then(function (r) {
      if (r.ok || r.status === 409) { Parakli.markVerified(); goMain(); return; }
      sending = false; validate(false);
      if (r.status === 401) {
        msg.textContent = 'Откройте приложение из Telegram: отправьте боту команду /start.';
      } else if (r.data && r.data.fields) {
        Object.keys(r.data.fields).forEach(function (k) {
          var w = document.querySelector('.field[data-for="' + k + '"]');
          if (w) w.classList.add('invalid');
        });
        msg.textContent = 'Проверьте выделенные поля.';
      } else {
        msg.textContent = 'Не удалось сохранить данные. Попробуйте ещё раз.';
      }
    }).catch(function () {
      sending = false; validate(false);
      msg.textContent = 'Нет связи с сервером. Попробуйте ещё раз.';
    });
  });

  /* ---------- Окно с документом ---------- */
  // Тексты документов лежат в documents.js (window.PARAKLI_DOCS)
  var DOCS = window.PARAKLI_DOCS || {};
  var KICKERS = { consent: 'Документ 01', ads: 'Документ 02', policy: 'Документ 03', terms: 'Документ 04' };

  // Текст → узлы: почта и ссылки кликабельные, упоминание Политики открывает документ 03
  var LINK_RE = /([\w.+-]+@[\w-]+\.[\w.]+\w)|(https?:\/\/[^\s;,)]+)|(Политик[аиойуе]{1,2} обработки персональных данных(?: «Паракли»)?)/g;
  function richText(el, text, key) {
    var last = 0, m;
    LINK_RE.lastIndex = 0;
    while ((m = LINK_RE.exec(text))) {
      if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a;
      if (m[1]) { a = document.createElement('a'); a.href = 'mailto:' + m[1]; a.textContent = m[1]; }
      else if (m[2]) {
        a = document.createElement('a'); a.href = m[2]; a.textContent = m[2]; a.target = '_blank'; a.rel = 'noopener';
        a.addEventListener('click', function (e) {          // ссылки на t.me открываем внутри Telegram
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg && tg.openTelegramLink && /^https:\/\/t\.me\//.test(this.href)) { e.preventDefault(); tg.openTelegramLink(this.href); }
        });
      } else if (key !== 'policy') {
        a = document.createElement('a'); a.href = '#'; a.className = 'xref'; a.textContent = m[3];
        a.addEventListener('click', function (e) { e.preventDefault(); openDoc('policy', docOpener); });
      } else { a = document.createTextNode(m[3]); }
      el.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
    return el;
  }

  var docModal = $('docModal'), docTimer = null, docOpener = null;

  function openDoc(key, opener) {
    var d = DOCS[key];
    if (!d) return;
    clearTimeout(docTimer);
    $('docKicker').textContent = KICKERS[key] || '';
    $('docTitleText').textContent = d.title;
    $('docEdition').textContent = d.edition || '';
    $('docEdition').hidden = !d.edition;
    var body = $('docBody'), box = body, list = null, first = true;
    body.textContent = '';
    var lastH = -1;
    d.blocks.forEach(function (b, i) { if (b[0] === 'h') lastH = i; });
    d.blocks.forEach(function (b, i) {
      if (b[0] !== 'li') list = null;
      if (b[0] === 'h') {
        if (i === lastH && /Подтверждение/.test(b[2])) { box = document.createElement('div'); box.className = 'final'; body.appendChild(box); }
        var h = document.createElement('h3');
        var n = document.createElement('span'); n.className = 'n'; n.textContent = b[1];
        h.appendChild(n); h.appendChild(document.createTextNode(b[2]));
        box.appendChild(h);
      } else if (b[0] === 'li') {
        if (!list) { list = document.createElement('ul'); box.appendChild(list); }
        list.appendChild(richText(document.createElement('li'), b[1], key));
      } else {
        var p = richText(document.createElement('p'), b[1], key);
        if (first && d.blocks[0][0] === 'p') p.className = 'lead';   // вступление — в карточке
        box.appendChild(p);
      }
      first = false;
    });
    body.scrollTop = 0;
    docOpener = opener || null;
    docModal.hidden = false;
    document.documentElement.classList.add('noscroll');
    requestAnimationFrame(function () { docModal.classList.add('open'); });
    $('docOk').focus();
  }

  function closeDoc() {
    if (docModal.hidden) return;
    docModal.classList.remove('open');
    document.documentElement.classList.remove('noscroll');
    docTimer = setTimeout(function () { docModal.hidden = true; }, 230);
    if (docOpener && docOpener.focus) docOpener.focus();
  }

  Array.prototype.forEach.call(document.querySelectorAll('.doc-link'), function (b) {
    b.addEventListener('click', function () { openDoc(b.getAttribute('data-doc'), b); });
  });
  $('docX').addEventListener('click', closeDoc);
  $('docOk').addEventListener('click', closeDoc);
  docModal.addEventListener('click', function (e) { if (e.target === docModal) closeDoc(); });   // нажатие вне окна
  document.addEventListener('keydown', function (e) {
    if (docModal.hidden) return;
    if (e.key === 'Escape') { closeDoc(); return; }
    if (e.key === 'Tab') {                                   // фокус не уходит за пределы окна
      var f = Array.prototype.slice.call(docModal.querySelectorAll('button, a[href]')), i = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
    }
  });

  validate(false);
})();
</script>
</body>
</html>
